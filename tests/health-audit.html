<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>健康功能检查</title><style>body{font:16px system-ui;padding:24px;background:#f7f7f4;color:#245c4f}iframe{position:fixed;left:10000px;width:390px;height:844px;border:0}</style><h1>健康功能检查</h1><p id="summary">正在检查…</p><ol id="results"></ol><iframe id="target"></iframe><script>
(async()=>{
const frame=document.getElementById('target');let passed=0,failed=0;
const load=key=>new Promise(resolve=>{frame.onload=async()=>{await frame.contentDocument.fonts.ready;resolve(frame.contentWindow)};frame.src='../tools/ui-preview.html?screen='+key});
const click=(w,s)=>{const e=w.document.querySelector(s);if(!e)throw Error('缺少 '+s);e.click()};
const fill=(w,id,value)=>{const e=w.document.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}))};
const pick=(w,id,index)=>{click(w,`[data-picker-for="${id}"]`);click(w,`[data-choice="${index}"]`)};
const assert=(v,m)=>{if(!v)throw Error(m)};
async function test(name,fn){const li=document.createElement('li');try{await fn();passed++;li.textContent='通过：'+name}catch(e){failed++;li.textContent='失败：'+name+'：'+e.message}document.getElementById('results').append(li)}
await test('资料缺失时无假目标，填写资料后形成自动目标',async()=>{const w=await load('36');assert(w.document.body.innerText.includes('待设置目标'),'未提示补全');click(w,'[data-go="health-profile"]');fill(w,'hp-age','30');pick(w,'hp-activity',1);assert(w.document.getElementById('hp-age').value==='30','弹窗丢失输入');pick(w,'hp-goal',1);click(w,'#save-health-profile');assert(w.document.querySelector('.calorie-ring').getAttribute('aria-label').includes('目标'),'没有生成目标');assert(!w.document.body.innerText.includes('待设置目标'),'目标没有更新')});
await test('饮食新增、修改、删除恢复与每日统计',async()=>{const w=await load('36');click(w,'[data-go="nutrition"]');click(w,'[data-go="meal-form"]');fill(w,'meal-name','测试午餐');fill(w,'meal-calories','500');click(w,'#save-meal');assert(w.document.querySelector('.calorie-ring strong').textContent==='500','新增热量未计入');click(w,'[data-meal-id]');fill(w,'meal-calories','600');click(w,'#save-meal');assert(w.document.querySelector('.calorie-ring strong').textContent==='600','编辑重复累加或未更新');click(w,'[data-meal-id]');click(w,'#delete-meal');assert(w.document.querySelector('.calorie-ring strong').textContent==='0','删除未更新');click(w,'#undo-meal');assert(w.document.querySelector('.calorie-ring strong').textContent==='600','撤销删除失败');click(w,'[data-go="meal-form"]');assert(w.document.getElementById('meal-name').value==='','新建复用了旧记录');});
await test('个人健康无家庭成员和姓名，全部入口使用个人记录',async()=>{const w=await load('36');assert(!w.document.querySelector('[data-health]'),'仍有成员切换');assert(!/家庭成员|家庭健康|李明|王芳/.test(w.document.body.innerText),'仍展示成员或姓名');click(w,'[data-go="health-profile"]');assert(!w.document.getElementById('hp-name'),'仍需姓名');click(w,'[data-back]');click(w,'[data-go="health-person"]');assert(w.document.body.innerText.includes('体重记录'),'体重入口缺失');assert(!/李明|王芳/.test(w.document.body.innerText),'体重页显示姓名');click(w,'[data-go="nutrition"]');click(w,'[data-go="meal-form"]');fill(w,'meal-name','个人午餐');fill(w,'meal-calories','400');click(w,'#save-meal');assert(w.document.querySelector('.calorie-ring strong').textContent==='400','个人记录未计入');assert(!/李明|王芳/.test(w.document.body.innerText),'饮食页显示姓名');});
await test('模型配置入口、会话保存与清除',async()=>{const w=await load('13');click(w,'[data-go="model-settings"]');fill(w,'model-endpoint','https://example.invalid/v1/chat/completions');fill(w,'model-name','test-vision');fill(w,'model-key','test-placeholder-not-a-secret');pick(w,'model-no-key',0);assert(w.document.getElementById('model-key').value==='test-placeholder-not-a-secret','切换丢失输入');click(w,'#save-model');assert(w.document.body.innerText.includes('已保存'),'配置未保存');click(w,'#clear-model');assert(w.document.getElementById('model-endpoint').value==='','清除未生效');});

const fixture=await fetch('../artifacts/vision-apple.jpg').then(r=>r.blob());
const image=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(fixture)});
async function photoSetup(){const w=await load('36');click(w,'[data-go="nutrition"]');click(w,'[data-go="food-photo"]');let ids=[];w.AndroidBridge={getModelConfig:()=>JSON.stringify({endpoint:'https://example.invalid',model:'test',hasKey:true}),analyzeFood:(id,body)=>{ids.push(id);assert(!body.includes('weight'),'上传健康资料')},cancelFoodRequest:()=>{}};w.foodPhotoResult({image});return {w,ids}}
const response={foods:[{name:'苹果',portion:'一个',calories:95},{name:'米饭',portion:'一碗',calories:230}],notes:'仅估算'};
await test('照片识别先核对，修改份量热量后确认；重复点击不重复入账',async()=>{const {w,ids}=await photoSetup();click(w,'#analyze-food');w.foodVisionResult(ids[0],{response});assert(w.document.querySelector('#confirm-food'),'未显示核对');fill(w,'food-kcal-0','110');fill(w,'food-portion-0','半个');pick(w,'photo-meal-type',3);assert(w.document.getElementById('food-kcal-0').value==='110','弹窗丢失修改');click(w,'[data-remove-food="1"]');const button=w.document.getElementById('confirm-food');button.click();button.click();assert(w.document.querySelector('.calorie-ring strong').textContent==='110','确认金额或重复确认错误');assert(w.document.querySelectorAll('[data-meal-id]').length===1,'记录数量错误');click(w,'[data-meal-id]');assert(w.document.getElementById('meal-portion').value==='半个','份量修改丢失');});
await test('取消及过期响应不显示结果，不自动计入',async()=>{const {w,ids}=await photoSetup();click(w,'#analyze-food');click(w,'#cancel-vision');w.foodVisionResult(ids[0],{response});assert(!w.document.querySelector('#confirm-food'),'取消后仍显示结果');click(w,'#analyze-food');w.foodVisionResult(ids[0],{response});assert(w.document.querySelector('#cancel-vision'),'旧响应影响新请求');w.foodVisionResult(ids[1],{response});click(w,'[data-back]');assert(w.document.querySelector('.calorie-ring strong').textContent==='0','未经确认已入账');});
await test('无食物、服务失败与错误热量可重试且不入账',async()=>{const {w,ids}=await photoSetup();click(w,'#analyze-food');w.foodVisionResult(ids[0],{response:{foods:[],notes:'没有食物'}});assert(!w.document.querySelector('#confirm-food'),'无食物可确认');click(w,'#analyze-food');w.foodVisionResult(ids[1],{error:'接口鉴权失败'});assert(w.document.body.innerText.includes('接口鉴权失败'),'失败没有提示');click(w,'#analyze-food');w.foodVisionResult(ids[2],{response});fill(w,'food-kcal-0','-1');click(w,'#confirm-food');assert(w.document.querySelector('#confirm-food'),'非法热量已入账');});

document.getElementById('summary').textContent=`${passed} 项通过，${failed} 项失败`;
})();</script></html>
